<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة الرئيسية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="langSwitcher" class="lang-switcher" role="group" aria-label="Language"></div>

  <header class="hero">
    <h1 data-i18n="heroTitle">مرحبًا بيك 👋</h1>
    <p data-i18n="heroSubtitle">تواصل معانا مباشرة، وهيتم الرد عليك أوتوماتيك عبر بوت واتساب.</p>
  </header>

  <main class="contact-section">
    <h2 data-i18n="contactHeading">تواصل معنا</h2>
    <form id="contactForm">
      <label for="name" data-i18n="labelName">الاسم</label>
      <input type="text" id="name" name="name" required />

      <label for="phone" data-i18n="labelPhone">رقم الهاتف</label>
      <input type="tel" id="phone" name="phone" data-i18n-placeholder="phonePlaceholder" placeholder="مثال: 201xxxxxxxxx" required />

      <label for="message" data-i18n="labelMessage">الرسالة</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit" data-i18n="submitBtn">إرسال عبر واتساب</button>
    </form>
    <p id="formStatus"></p>
  </main>

  <!-- زرار واتساب عائم لبدء محادثة مباشرة مع البوت -->
  <a
    id="whatsappFloatBtn"
    class="whatsapp-float"
    href="#"
    target="_blank"
    rel="noopener"
    data-i18n-aria="whatsappAria"
    aria-label="تواصل عبر واتساب"
  >
    <svg viewBox="0 0 32 32" width="32" height="32" fill="white">
      <path d="M16 3C9.4 3 4 8.4 4 15c0 2.4.7 4.6 1.9 6.5L4 29l7.7-2c1.8 1 3.9 1.5 6.3 1.5 6.6 0 12-5.4 12-12S22.6 3 16 3zm0 21.8c-2 0-3.9-.5-5.5-1.5l-.4-.2-4.6 1.2 1.2-4.5-.3-.4C5.3 17.8 4.7 16 4.7 15c0-6.2 5.1-11.3 11.3-11.3S27.3 8.8 27.3 15 22.2 24.8 16 24.8zm6.2-8.4c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.5.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6 0-.2-.8-1.9-1.1-2.6-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.3 2.4 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/>
    </svg>
  </a>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
