services:
  - type: web
    name: aqua-trip-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: wwebjs-session
      mountPath: /var/data/wwebjs_auth
      sizeGB: 1
    envVars:
      - key: WWEBJS_AUTH_PATH
        value: /var/data/wwebjs_auth
      - key: FRONTEND_ORIGIN
        value: https://travela-template.vercel.app
      - key: FRONTEND_URL
        value: https://travela-template.vercel.app
      - key: PUBLIC_BACKEND_URL
        value: https://aqua-trip-backend.onrender.com
      - key: OWNER_NUMBER
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://aqua-trip-backend.onrender.com/api/auth/google/callback
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        value: https://aqua-trip-backend.onrender.com/api/auth/facebook/callback
